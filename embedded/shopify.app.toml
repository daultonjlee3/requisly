# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "aae0e4ae11ca6deb4d949eda0982fe2b"
application_url = "https://app.requisly.com"
embedded = true
name = "Requisly"

[access_scopes]
# Core catalog/inventory scopes only.
# read_orders is optional — Report Builder / velocity sync request it via App Bridge
# (shopify.scopes.request). We never request write_orders (Orders sync is read-only).
scopes = "read_inventory,read_locations,read_products,write_inventory"
optional_scopes = [ "read_orders" ]

[auth]
redirect_urls = [
  "https://app.requisly.com/auth/callback",
  "https://app.requisly.com/auth/shopify/callback",
  "https://app.requisly.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[build]
# Keep Partner URLs on app.requisly.com — do not overwrite with ephemeral Cloudflare tunnels.
automatically_update_urls_on_dev = false
